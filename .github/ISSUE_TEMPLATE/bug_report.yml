name: Bug report
description: Report a reproducible CodeGuard problem without sharing secrets.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove tokens, passwords, private repository content, and local paths from logs and screenshots."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe reproduction you can.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: CodeGuard version/commit, OS, Python, Docker, and LLM provider/model if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or evidence
      description: Include relevant errors or evidence IDs, with sensitive values removed.
